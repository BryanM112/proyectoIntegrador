services:
  postgres:
    image: postgres:16-alpine
    container_name: proyectointegrador-postgres-final
    restart: unless-stopped
    environment:
      POSTGRES_DB: academic_events_db
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - proyectointegrador_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ups -d academic_events_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: proyectointegrador-redis-final
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    ports:
      - "6380:6379"
    volumes:
      - proyectointegrador_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: proyectointegrador-api:1.0
    container_name: proyectointegrador-api-final
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  proyectointegrador_postgres_data:
  proyectointegrador_redis_data: